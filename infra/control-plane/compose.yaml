name: bigvps-control

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  control:
    build: .
    image: bigvps-control:local
    container_name: bigvps-control
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3100"
      COUCHDB_URL: http://couchdb:5984
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/bigvps:/opt/bigvps:ro
    networks:
      - landing
      - obsidian
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

networks:
  landing:
    external: true
    name: selickiy-landing_internal
  obsidian:
    external: true
    name: obsidian-sync_internal
